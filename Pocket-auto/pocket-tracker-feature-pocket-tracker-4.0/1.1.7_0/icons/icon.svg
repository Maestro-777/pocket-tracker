<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#00d4aa" stroke-width="2"/>

  <!-- Candlestick chart bars -->
  <!-- Bar 1 (bearish, red) -->
  <rect x="22" y="52" width="10" height="30" rx="1" fill="#ff4757"/>
  <line x1="27" y1="44" x2="27" y2="52" stroke="#ff4757" stroke-width="2"/>
  <line x1="27" y1="82" x2="27" y2="90" stroke="#ff4757" stroke-width="2"/>

  <!-- Bar 2 (bullish, green) -->
  <rect x="40" y="45" width="10" height="35" rx="1" fill="#00d4aa"/>
  <line x1="45" y1="36" x2="45" y2="45" stroke="#00d4aa" stroke-width="2"/>
  <line x1="45" y1="80" x2="45" y2="88" stroke="#00d4aa" stroke-width="2"/>

  <!-- Bar 3 (bearish, red) -->
  <rect x="58" y="50" width="10" height="25" rx="1" fill="#ff4757"/>
  <line x1="63" y1="42" x2="63" y2="50" stroke="#ff4757" stroke-width="2"/>
  <line x1="63" y1="75" x2="63" y2="84" stroke="#ff4757" stroke-width="2"/>

  <!-- Bar 4 (bullish, green, tall) -->
  <rect x="76" y="38" width="10" height="42" rx="1" fill="#00d4aa"/>
  <line x1="81" y1="28" x2="81" y2="38" stroke="#00d4aa" stroke-width="2"/>
  <line x1="81" y1="80" x2="81" y2="92" stroke="#00d4aa" stroke-width="2"/>

  <!-- Bar 5 (bullish, green) -->
  <rect x="94" y="42" width="10" height="36" rx="1" fill="#00d4aa"/>
  <line x1="99" y1="32" x2="99" y2="42" stroke="#00d4aa" stroke-width="2"/>
  <line x1="99" y1="78" x2="99" y2="88" stroke="#00d4aa" stroke-width="2"/>

  <!-- Robot/bot indicator dot -->
  <circle cx="99" cy="28" r="7" fill="#ffd700"/>
  <circle cx="99" cy="28" r="4" fill="#ff8c00"/>
</svg>
