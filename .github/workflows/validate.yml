name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bridge.py
      - name: Run bridge data tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Check indicator worker syntax
        run: node --check web/indicator-worker.js
      - name: Run indicator worker tests
        run: node --test web/indicator-worker.test.cjs
