<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Локальный доступ · Pocket TRADE ROBOT</title><link rel="stylesheet" href="local-users.css"></head>
<body>
<main class="panel">
  <div class="brand">POCKET <b>TRADE ROBOT</b><small>LOCAL ACCESS · EXPANSION</small></div>
  <h1 id="pageTitle">Локальный вход</h1>
  <p id="authHint">Учётные записи хранятся локально.</p>
  <p id="currentUser" class="current"></p>
  <form id="authForm">
    <label>Логин<input name="login" autocomplete="username" required minlength="3" maxlength="32"></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="10"></label>
    <button id="submitAuth" type="submit">Продолжить</button>
  </form>
  <button id="logout" class="secondary" hidden>Выйти</button>
  <section id="ownerTools" hidden>
    <h2>Локальные пользователи</h2>
    <div id="userList"></div>
    <h2>Добавить пользователя</h2>
    <form id="createUserForm">
      <label>Логин<input name="login" required minlength="3" maxlength="32"></label>
      <label>Временный пароль<input name="password" type="password" required minlength="10"></label>
      <label>Роль<select name="role"><option value="trader">Trader — торговля</option><option value="viewer">Viewer — только просмотр</option></select></label>
      <button type="submit">Создать пользователя</button>
    </form>
  </section>
  <p id="status" role="status"></p>
  <footer>Пароли хранятся в виде PBKDF2-хеша. Сброс данных Chrome удалит локальные учётные записи.</footer>
</main>
<script type="module" src="local-users.js"></script>
</body></html>
